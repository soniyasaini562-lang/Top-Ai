<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top AI</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
    .user { background: #2563eb; align-self: flex-end; }
    .bot { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }
    #input-box { display: flex; padding: 10px; background: #1e293b; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: none; outline: none; background: #0f172a; color: white; }
    button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="chat-box">
    <div class="msg bot">Namaste! Main Aapka Top AI hoon. Aap mujhse koi bhi sawal pooch sakte hain.</div>
  </div>
  <div id="input-box">
    <input type="text" id="userInput" placeholder="Apna sawal yahan likhein..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>
  <script>
    const a = "gsk_xarwAqjJJsS";
    const b = "Cbof0ZQpWGdyb3FY";
    const c = "zQ3FtjiHvc0cBYe9BcJYnCX8";
    const API_KEY = a + b + c;

    async function sendMsg() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chat-box");
      const text = input.value.trim();
      if (!text) return;
      chatBox.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "msg bot";
      loadingDiv.innerText = "Soch raha hoon...";
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "system", content: "Tone polite, respectful, direct. Always address user as 'Aap'." }, { role: "user", content: text }] })
        });
        const data = await response.json();
        if(data.choices && data.choices[0]) {
          loadingDiv.innerText = data.choices[0].message.content;
        } else {
          loadingDiv.innerText = "Error! Invalid API Key.";
        }
      } catch (err) {
        loadingDiv.innerText = "Error! Connection problem.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
